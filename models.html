<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Models | 3D Model Viewer</title>

  <script type="module" crossorigin src="./assets/models-3pJllcQg.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/app-header-Cu5nXzn-.js">
  <link rel="modulepreload" crossorigin href="./assets/ModelPanel-DcSUaDVR.js">
  <link rel="stylesheet" crossorigin href="./assets/app-header-caoLWeQ0.css">
</head>

<body>
    <app-header></app-header>

    <div class="model-viewer">

        <nav id="pager" aria-label="Model pages">

            <button id="prev" type="button">
                Previous
            </button>

            <span id="page-label" aria-live="polite"></span>

            <button id="next" type="button">
                Next
            </button>

        </nav>

        <main id="panels" aria-label="3D Model Gallery">
            <!-- Model panels are dynamically generated by models.ts -->
        </main>

        <!-- Fullscreen layer: shared by every panel and driven by models.ts.
             Hidden until a viewer is enlarged. -->
        <div id="fullscreen-backdrop" class="fullscreen-backdrop"></div>

        <div id="fullscreen-controls" class="fullscreen-controls" role="toolbar" aria-label="Fullscreen controls">
            <button id="fs-toggle" class="toggle" type="button">Pause</button>
            <button id="fs-minimize" class="minimize-btn" type="button" aria-label="Exit fullscreen">
                - Minimize
            </button>
        </div>

    </div>

</body>

</html>
