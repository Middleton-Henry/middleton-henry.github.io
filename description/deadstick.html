        <!-- Title -->
        <img class="description-logo pixelated" src="../assets/title-Dji4lkEP.png" alt="DEADSTICK title">

        <p>
            DEADSTICK is a fishing horror game built in Godot. The 3D models were made in Blender and the
            music and sound in Audition. Gameplay is scripted in GDScript, and the visuals use custom
            shaders written in GDShader.
        </p>
